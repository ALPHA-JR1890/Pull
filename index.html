<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetry Matrix Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <header class="app-header">
            <h1>System Intelligence Matrix</h1>
            <p>Real-time sandbox performance benchmarks and diagnostic analytics</p>
        </header>

        <!-- Metric Cards Grid -->
        <div class="metrics-grid">
            <div class="metric-card">
                <label>Processing Latency</label>
                <div class="metric-value" id="latency-val">0.0 ms</div>
            </div>
            <div class="metric-card">
                <label>Heap Memory Usage</label>
                <div class="metric-value" id="memory-val">Checking...</div>
            </div>
            <div class="metric-card">
                <label>Estimated Memory Limit</label>
                <div class="metric-value" id="memory-limit-val">Checking...</div>
            </div>
            <div class="metric-card">
                <label>Network Link Velocity</label>
                <div class="metric-value" id="network-val">Checking...</div>
            </div>
        </div>

        <!-- Visualization Graphs -->
        <div class="visualization-section">
            <div class="graph-container">
                <div class="graph-header">
                    <h3>Performance Timeline (Last 30 Seconds)</h3>
                    <span class="legend-indicator">Green = Memory (MB) | Blue = Latency (ms)</span>
                </div>
                <div class="canvas-wrapper">
                    <canvas id="telemetry-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- Event Logging Console -->
        <div class="console-section">
            <div class="console-header">
                <h3>Runtime Event Log Ledger</h3>
                <button class="btn-clear" onclick="clearConsoleLog()">Purge Log</button>
            </div>
            <div class="console-output" id="console-output">System telemetry diagnostics online...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
